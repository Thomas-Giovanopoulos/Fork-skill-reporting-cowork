<style>
:root {
  --navy:#0D1B2A; --navy-mid:#162335; --navy-light:#1E3048;
  --gold:#B8975A; --gold-light:#D4B07A; --gold-pale:#F5EDD8;
  --cream:#FAF7F2; --white:#FFFFFF;
  --muted:#7A8899; --border:rgba(184,151,90,0.18); --bl:rgba(13,27,42,0.07);
  --up:#2D6E4E; --dn:#8B2E2E; --up-bg:rgba(45,110,78,0.08); --dn-bg:rgba(139,46,46,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--cream);color:var(--navy);font-family:'DM Sans',sans-serif;font-weight:300;font-size:12.5px;line-height:1.55;-webkit-font-smoothing:antialiased;}

  /* --- Canvas à scale uniforme (document desktop, largeur de design fixe) --- */
  .rpt-scale-outer{overflow:hidden;width:100%;}
  .rpt-canvas{width:1280px;margin:0 auto;transform-origin:top center;}  /* width pilotée en JS : clamp(1200,vw,1600) */
  @media print{ .rpt-scale-outer{overflow:visible;height:auto!important;} .rpt-canvas{width:auto!important;transform:none!important;margin:0;} }

/* HERO */
.hero{background-color:var(--navy);padding:48px 64px 44px;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;bottom:-80px;right:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(184,151,90,0.1) 0%,transparent 65%);pointer-events:none;}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:36px;position:relative;z-index:3;}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);}
.brand-sub{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-top:3px;}
.hero-ref{text-align:right;font-size:14px;color:rgba(255,255,255,.34);line-height:1.85;}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:300;color:var(--white);line-height:1.08;margin-bottom:6px;}
.hero-title em{color:var(--gold-light);font-style:italic;}
.hero-sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:40px;}
.hero-main{display:flex;justify-content:space-between;align-items:center;gap:48px;min-height:140px;position:relative;z-index:3;}
.hero-kpi{text-align:right;flex:none;}
.hero-kpi-val{font-size:78px;color:var(--gold-light);line-height:1;}
  /* --- Essaim d'abeilles : aspect du motif CSS (silhouette dorée, demi-décalage 150px, opacité .22) ;
         fonctionnalités de l'essaim : pose alignée + vague de propagation dorée depuis le point de pose --- */
  .hero-swarm{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .swarm-bee{position:absolute;opacity:0;will-change:opacity,transform;transform-origin:center;animation:swarmIn 1s ease-out forwards;}
  @keyframes swarmIn{
    0%{opacity:0;transform:scale(1.35);filter:brightness(1.9) saturate(1.2)}
    30%{opacity:.75;transform:scale(1.1);filter:brightness(1.5) saturate(1.1)}
    100%{opacity:.22;transform:scale(1);filter:brightness(1)}}
  .hero-eclat{position:absolute;left:50%;top:50%;width:30px;height:30px;border-radius:50%;z-index:1;opacity:0;pointer-events:none;
    background:radial-gradient(circle,rgba(224,196,140,.95),rgba(184,151,90,.45) 42%,transparent 72%);
    transform:translate(-50%,-50%) scale(0);animation:eclat 1.4s ease-out 3.35s forwards;}
  @keyframes eclat{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{opacity:1}42%{opacity:.8}100%{transform:translate(-50%,-50%) scale(13);opacity:0}}
  .hero-bee{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;}
  .hero-bee-fly{animation:beeFly 3.8s cubic-bezier(.33,0,.2,1) forwards;will-change:transform,opacity;transform-origin:center;}
  .bee-img{width:56px;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.30));}
  @keyframes beeFly{
    0%{transform:translate(-60px,-255px) scale(.62) rotate(-16deg);opacity:0}
    8%{opacity:1}
    26%{transform:translate(-175px,-120px) scale(.84) rotate(13deg)}
    50%{transform:translate(-85px,8px) scale(.96) rotate(-8deg)}
    72%{transform:translate(-165px,108px) scale(.9) rotate(9deg)}
    86%{transform:translate(46px,66px) scale(.86) rotate(-4deg)}
    91%{transform:translate(0,0) scale(.83) rotate(0deg);opacity:1}
    100%{transform:translate(0,0) scale(.83) rotate(0deg);opacity:0}}
  @media (prefers-reduced-motion: reduce){
    .hero-bee-fly{animation:none!important;opacity:0}
    .hero-eclat{animation:none!important;opacity:0}
    .swarm-bee{animation:none!important;opacity:.22!important;filter:none!important;transform:none!important}}

/* KPI STRIP */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);padding-top:24px;}
.kpi{padding:0 20px;border-right:1px solid var(--border);}
.kpi:first-child{padding-left:0;}
.kpi:last-child{border-right:none;}
.kpi-lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:6px;}
.kpi-val{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;color:var(--white);line-height:1;margin-bottom:3px;}
.kpi-val .u{font-size:15px;color:var(--gold-light);}
.kpi-sub{font-size:10.5px;color:rgba(255,255,255,.35);}
.c-neg{color:#E07878;}.c-pos{color:#7EC8A0;}.c-gold{color:var(--gold-light);}

/* LAYOUT */
.page{padding:0 64px 56px;}
.sec{padding-top:40px;margin-bottom:8px;}
.sec-hd{display:flex;align-items:baseline;gap:14px;margin-bottom:20px;}
.sec-num{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--gold);letter-spacing:.08em;}
.sec-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;}
.sec-rule{flex:1;height:1px;background:var(--border);}

/* CHIFFRES CLÉS */
.kpi-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
.kpi-cards-b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:28px;}
.card{background:var(--white);border:1px solid var(--bl);border-radius:6px;padding:18px 20px;}
.card-lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.card-val{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;color:var(--navy);line-height:1;margin-bottom:3px;}
.card-val .u{font-size:14px;color:var(--gold);}
.card-sub{font-size:11px;color:var(--muted);}
.card-neg{border-left:3px solid var(--dn);}
.card-pos{border-left:3px solid var(--up);}
.card-gold{border-left:3px solid var(--gold);background:var(--gold-pale);}
.card-navy{background:var(--navy);border-color:transparent;}
.card-navy .card-lbl{color:rgba(255,255,255,.35);}
.card-navy .card-val{color:var(--white);}
.card-navy .card-val .u{color:var(--gold-light);}
.card-navy .card-sub{color:rgba(255,255,255,.4);}
.mvt-tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;background:var(--dn-bg);color:var(--dn);font-weight:500;margin-top:6px;}

/* ═══════════════════════════
   TABLEAU UNIVERSEL
═══════════════════════════ */
.pat{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px;}

/* En-têtes */
.pat thead th{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:8px 14px 12px 0;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
.pat thead th:first-child{text-align:left;padding-left:0;}
.pat thead th:last-child{padding-right:12px;}

/* Ligne groupe entité (Client Exemple / Holding) */
.rg td{background:var(--navy);color:var(--white);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:14px 16px 14px;border:none;}
.rg td:first-child{border-radius:4px 0 0 4px;padding-left:16px;}
.rg td:last-child{border-radius:0 4px 4px 0;padding-right:16px;}
.rg .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:middle;margin-top:-2px;}

/* Ligne sous-groupe catégorie (Immo / Financier / Non coté) */
.rcat td{
  background:rgba(184,151,90,0.07);color:var(--gold);font-size:9.5px;
  font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 10px 7px 0;border-bottom:1px solid var(--border);
}
.rcat td:first-child{padding-left:14px;}

/* Ligne contrat/bien */
.rc td{padding:10px 14px 10px 0;border-bottom:1px solid var(--bl);text-align:right;vertical-align:top;}
.rc td:first-child{text-align:left;padding-left:22px;}
.rc td:last-child{padding-right:12px;}
.cname{font-size:12.5px;color:var(--navy);}
.cdet{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4;}
.mvt-note{font-size:10px;color:var(--dn);font-style:italic;margin-top:2px;}
.tag{display:inline-block;padding:1px 7px;border-radius:2px;font-size:10px;background:rgba(13,27,42,0.06);color:var(--muted);white-space:nowrap;}
.tag-gold{background:rgba(184,151,90,0.12);color:var(--gold);}
.tag-up{background:var(--up-bg);color:var(--up);}

/* Badges perf */
.b-neg{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;background:var(--dn-bg);color:var(--dn);}
.b-pos{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;background:var(--up-bg);color:var(--up);}
.b-neu{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:500;background:rgba(122,136,153,0.1);color:var(--muted);}
.b-ph{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-style:italic;background:rgba(184,151,90,0.1);color:var(--gold);}
.v-neg{color:var(--dn);}.v-pos{color:var(--up);}.v-muted{color:var(--muted);font-size:11px;}

/* Sous-total poche (contrat multi-poches) */
.rsub td{
  background:rgba(13,27,42,0.03);padding:7px 10px;font-weight:400;font-size:11px;
  text-align:right;border-top:1px solid var(--bl);border-bottom:1px solid var(--bl);
  color:var(--muted);font-style:italic;
}
.rsub td:first-child{text-align:left;padding-left:20px;}
.rsub td:last-child{padding-right:0;}

/* Total catégorie (Liquidités / Immo / Financier / Non coté / Dettes) */
.rtot td{
  background:#EEF1F5;padding:10px 10px;font-weight:600;font-size:12px;
  text-align:right;border-top:2px solid rgba(13,27,42,0.15);border-bottom:1px solid rgba(13,27,42,0.1);
  color:var(--navy);
}
.rtot td:first-child{text-align:left;padding-left:14px;border-radius:0;}
.rtot td:last-child{padding-right:12px;}

/* Sous-total entité */
.rst td{background:#1E3048;color:var(--white);padding:10px 10px;font-weight:500;font-size:12px;text-align:right;border-top:none;}
.rst td:first-child{text-align:left;border-radius:0;padding-left:14px;}
.rst td:last-child{border-radius:0;padding-right:12px;color:var(--white);}

/* Grand total */
.rt td{background:var(--navy);color:var(--white);padding:13px 12px;font-size:13px;font-weight:500;text-align:right;border:none;}
.rt td:first-child{font-family:'Cormorant Garamond',serif;font-size:16px;text-align:left;border-radius:5px 0 0 5px;padding-left:20px;}
.rt td:last-child{border-radius:0 5px 5px 0;padding-right:20px;}

/* Spacer */
.rsp td{height:12px;border:none;background:transparent;}

/* ═══════════════════════════
   ALLOCATION
═══════════════════════════ */
.alloc-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
.alloc-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:32px;}
.chart-card{background:var(--white);border:1px solid var(--bl);border-radius:8px;padding:22px 24px;}
.chart-title{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;}
.chart-inner{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;}
.chart-inner-sm{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;}
.donut-wrap{position:relative;flex-shrink:0;}
.dc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
.dc-val{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--navy);line-height:1;}
.dc-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

/* Légende avec nominal */
.leg{display:flex;flex-direction:column;gap:5px;}
.leg-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--bl);}
.leg-row:last-child{border-bottom:none;}
.leg-left{display:flex;align-items:center;gap:7px;flex:1;}
.leg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;margin-top:2px;}
.leg-info{display:flex;flex-direction:column;gap:1px;}
.leg-name{font-size:11.5px;color:var(--navy);}
.leg-nom{font-size:10.5px;color:var(--muted);}
.leg-right{text-align:right;flex-shrink:0;}
.leg-pct{font-size:12.5px;font-weight:500;color:var(--navy);}

/* NOTE */
.note{background:rgba(184,151,90,0.06);border-left:3px solid var(--gold);padding:12px 18px;border-radius:0 4px 4px 0;margin-bottom:16px;}
.note p{font-size:11.5px;color:var(--navy);line-height:1.75;}
.note strong{color:var(--gold);font-weight:500;}

/* FOOTER */
.footer{background:var(--navy);padding:20px 64px;display:flex;justify-content:space-between;font-size:10.5px;color:rgba(255,255,255,.28);}
.footer strong{color:var(--gold);font-weight:500;}
</style>
